name: JonliOboy EXE
on:
  push:
    branches: [jonli-oboy]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psutil pyinstaller
      - run: pyinstaller --noconsole --onefile --name JonliOboy jonli_oboy.py
      - uses: actions/upload-artifact@v4
        with:
          name: JonliOboy-exe
          path: dist/JonliOboy.exe
